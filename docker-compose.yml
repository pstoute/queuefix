services:
  application-cache:
    image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    entrypoint: ["/bin/sh", "/usr/local/bin/clear-application-config-cache"]
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./docker/clear-application-config-cache.sh:/usr/local/bin/clear-application-config-cache:ro
      - ./bootstrap/cache:/var/www/html/bootstrap/cache

  database-secret:
    image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    entrypoint: ["/bin/sh", "/usr/local/bin/initialize-database-secrets"]
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./docker/initialize-database-secrets.sh:/usr/local/bin/initialize-database-secrets:ro
      - database_credentials:/run/queuefix-secrets

  database-credentials:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    entrypoint: ["/bin/sh", "/usr/local/bin/secure-postgres-credential"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PGCONNECT_TIMEOUT: "5"
      PGHOST: postgres
      PGUSER: queuefix
      PGDATABASE: queuefix
      QUEUEFIX_DATABASE_PASSWORD_FILE: /run/queuefix-secrets/database-password
    volumes:
      - ./docker/secure-postgres-credential.sh:/usr/local/bin/secure-postgres-credential:ro
      - database_credentials:/run/queuefix-secrets:ro
    depends_on:
      application-cache:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - queuefix

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
      - database_credentials:/run/queuefix-secrets:ro
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=queuefix
      - DB_USERNAME=queuefix
      - DB_PASSWORD_FILE=/run/queuefix-secrets/database-password
      - REDIS_HOST=redis
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - TRUSTED_PROXY_REQUIRED=true
      - TRUSTED_PROXIES=${QUEUEFIX_NETWORK_GATEWAY:-172.30.255.1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - queuefix

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: php artisan migrate --force
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - database_credentials:/run/queuefix-secrets:ro
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=queuefix
      - DB_USERNAME=queuefix
      - DB_PASSWORD_FILE=/run/queuefix-secrets/database-password
    depends_on:
      database-credentials:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - queuefix

  # PostgreSQL (default)
  postgres:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: queuefix
      POSTGRES_USER: queuefix
      POSTGRES_PASSWORD_FILE: /run/queuefix-secrets/database-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - database_credentials:/run/queuefix-secrets:ro
    depends_on:
      database-secret:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuefix"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - queuefix

  redis:
    image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - queuefix

  mailpit:
    image: axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - queuefix

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - database_credentials:/run/queuefix-secrets:ro
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=queuefix
      - DB_USERNAME=queuefix
      - DB_PASSWORD_FILE=/run/queuefix-secrets/database-password
      - REDIS_HOST=redis
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - queuefix

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: php artisan schedule:work
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - database_credentials:/run/queuefix-secrets:ro
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=queuefix
      - DB_USERNAME=queuefix
      - DB_PASSWORD_FILE=/run/queuefix-secrets/database-password
      - REDIS_HOST=redis
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - queuefix

volumes:
  postgres_data:
  database_credentials:
  redis_data:

networks:
  queuefix:
    driver: bridge
    ipam:
      config:
        - subnet: ${QUEUEFIX_NETWORK_SUBNET:-172.30.255.0/28}
          gateway: ${QUEUEFIX_NETWORK_GATEWAY:-172.30.255.1}
