name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests-pgsql:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: queuefix_test
          POSTGRES_USER: queuefix
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, zip, bcmath, intl, imap
          coverage: xdebug

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm build

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: queuefix_test
          DB_USERNAME: queuefix
          DB_PASSWORD: secret
        run: php artisan migrate --force

      - name: Run Pest tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: queuefix_test
          DB_USERNAME: queuefix
          DB_PASSWORD: secret
        run: php artisan test --coverage --min=50

      - name: Run Vitest
        run: pnpm test -- --run

  tests-mysql:
    name: Tests (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: queuefix_test
          MYSQL_USER: queuefix
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, zip, bcmath, intl, imap
          coverage: xdebug

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm build

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: queuefix_test
          DB_USERNAME: queuefix
          DB_PASSWORD: secret
        run: php artisan migrate --force

      - name: Run Pest tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: queuefix_test
          DB_USERNAME: queuefix
          DB_PASSWORD: secret
        run: php artisan test --coverage --min=50

  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker build context excludes local secrets
        run: bash scripts/verify-docker-build-context.sh

      - name: Verify Docker images build
        run: |
          docker build --target development --tag queuefix-ci-development .
          docker image inspect queuefix-ci-development --format '{{json .Config.Cmd}}' | grep -F -- '--no-reload'
          docker run --rm queuefix-ci-development sh -c 'pnpm exec esbuild --version >/dev/null'
          docker run --rm queuefix-ci-development php -r 'exit(extension_loaded("imap") && function_exists("imap_open") && function_exists("imap_status") && function_exists("imap_fetch_overview") && extension_loaded("pcntl") && defined("SA_UIDVALIDITY") && defined("FT_PEEK") && defined("ST_UID") ? 0 : 1);'
          docker build --target production --tag queuefix-ci-production .
          docker image inspect queuefix-ci-production --format '{{json .Config.Cmd}}' | grep -F -- '--no-reload'
          docker run --rm queuefix-ci-production php -r 'exit(extension_loaded("imap") && function_exists("imap_open") && function_exists("imap_status") && function_exists("imap_fetch_overview") && extension_loaded("pcntl") && defined("SA_UIDVALIDITY") && defined("FT_PEEK") && defined("ST_UID") ? 0 : 1);'
          docker run --rm queuefix-ci-production sh -c "test -f public/build/manifest.json && grep -F 'rtl\\:flex-row-reverse' public/build/assets/*.css >/dev/null && ! command -v node && ! command -v pnpm && ! test -e node_modules"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, zip, bcmath, intl, imap

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Verify Docker Compose service isolation
        run: |
          COMPOSE_EXPECTED_MAILER=smtp php scripts/verify-compose-security.php
          MAIL_MAILER=log COMPOSE_EXPECTED_MAILER=log php scripts/verify-compose-security.php

      - name: Run Pint (code style)
        run: vendor/bin/pint --test

      - name: Run Larastan (static analysis)
        run: vendor/bin/phpstan analyse --memory-limit=512M

  frontend-lint:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: pnpm build
